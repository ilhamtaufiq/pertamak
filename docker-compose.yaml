services:
  app:
    build: .
    expose:
      - "80"
    environment:
      - APP_NAME=Pertamak
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://pertamak.cianjur.space
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=pertamak
      - DB_USERNAME=pertamak
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - CACHE_STORE=file
      - SESSION_DRIVER=file
      - SESSION_DOMAIN=pertamak.cianjur.space
      - SESSION_SECURE_COOKIE=true
      - SANCTUM_STATEFUL_DOMAINS=pertamak.cianjur.space
      - QUEUE_CONNECTION=sync
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootsecret}
      - MYSQL_DATABASE=pertamak
      - MYSQL_USER=pertamak
      - MYSQL_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  storage:
  mysql_data:
